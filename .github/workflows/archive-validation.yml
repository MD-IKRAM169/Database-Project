name: Archive integrity and tooling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate and inventory original ZIP (read-only)
        run: python tools/archive_audit.py --archive 'Database Project.zip' --verify
